name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # Weekly Monday 03:00 UTC

jobs:
  gitleaks:
    name: Secret Scan (#102)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set GITLEAKS_LICENSE_KEY secret if running under a GitHub Organization account
          GITLEAKS_LICENSE_KEY: ${{ secrets.GITLEAKS_LICENSE_KEY }}

  deps:
    name: Dependency Audit (#103)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts || npm install --legacy-peer-deps
      - run: npm audit --omit=dev --audit-level=high
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, openssl, mbstring
      - working-directory: backend-laravel
        run: |
          composer install --no-interaction --prefer-dist
          composer audit --no-interaction

  postgres-security-tests:
    name: Security & Multi-Tenant Suite on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cafex_ci
          POSTGRES_USER: cafex
          POSTGRES_PASSWORD: ci_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, openssl, mbstring, pdo_sqlite
      - working-directory: backend-laravel
        env:
          APP_ENV: testing
          APP_KEY: base64:3f4sR8K9X2yA1bC3dE5fG7hI9jK1lM3nO5pQ7rS9tU0=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: cafex_ci
          DB_USERNAME: cafex
          DB_PASSWORD: ci_secure_password
        run: |
          composer install --no-interaction --prefer-dist
          php artisan test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts || npm install --legacy-peer-deps
      - run: npm test -- --run

  manual-controls-freshness:
    name: Manual Evidence Freshness Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/security/verify_manual_controls.mjs
